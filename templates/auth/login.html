<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Segmentasi Pelanggan</title>
    <!-- Google Fonts (Poppins & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-hover: #6d28d9;
            --bg-light: #faf8ff;
            --text-dark: #1e1b4b;
            --text-muted: #6b7280;
            --card-shadow: 0 10px 30px rgba(124, 58, 237, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background decoration */
        .bg-decorations {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.06) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(243, 232, 255, 0.5) 0%, transparent 50%),
                        #faf8ff;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s infinite alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background-color: rgba(124, 58, 237, 0.12);
            top: -100px;
            right: -50px;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background-color: rgba(233, 213, 255, 0.4);
            bottom: -100px;
            left: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Login Card */
        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            z-index: 10;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 1.25rem;
            border: 1px solid rgba(45, 42, 38, 0.06);
            box-shadow: var(--card-shadow);
            padding: 3rem 2.5rem;
            transition: transform 0.3s ease;
        }

        /* Brand / Header */
        .login-header {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .brand-badge {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.25);
            color: #ffffff;
        }

        .brand-badge i {
            font-size: 1.75rem;
            line-height: 1;
            color: #ffffff;
        }

        .login-header h5 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--text-dark);
            margin-bottom: 0.35rem;
            letter-spacing: -0.5px;
        }

        .login-header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Custom Inputs */
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .input-group-custom {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon-left {
            position: absolute;
            left: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 10;
            font-size: 1.1rem;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
        }

        .form-control-custom {
            width: 100%;
            padding: 0.85rem 1.1rem 0.85rem 2.85rem;
            border-radius: 0.85rem;
            border: 1.5px solid #ede9fe;
            background-color: #fcfbfe;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .form-control-custom::placeholder {
            color: #9ca3af;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        .input-group-custom:focus-within .input-icon-left {
            color: var(--primary-color);
        }

        /* Password Specifics */
        .form-control-custom.pe-5 {
            padding-right: 3rem;
        }

        .password-toggle-btn {
            position: absolute;
            right: 1.1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 10;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: var(--primary-color);
        }

        /* Flash Messages */
        .alert {
            border-radius: 0.85rem;
            border: none;
            font-size: 0.85rem;
            padding: 0.85rem 2.5rem 0.85rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .alert-warning {
            background-color: #fef3c7;
            color: #92400e;
        }

        .btn-close {
            font-size: 0.7rem;
            padding: 1.2rem;
        }

        /* Buttons */
        .btn-login {
            background-color: var(--primary-color);
            border: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem 1.5rem;
            border-radius: 0.85rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.25);
        }

        .btn-login:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(124, 58, 237, 0.15);
        }

        /* Footer Hints */
        .role-hint {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
            border-top: 1px solid #f3e8ff;
            padding-top: 1.5rem;
        }

        .role-hint span {
            background-color: #f3e8ff;
            color: var(--primary-color);
            padding: 0.2rem 0.6rem;
            border-radius: 0.25rem;
            font-weight: 600;
            font-size: 0.72rem;
            margin: 0 0.15rem;
        }
    </style>
</head>

<body>
    <div class="bg-decorations">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-container">
        <div class="login-card">

            <!-- Logo & Title -->
            <div class="login-header">
                <div class="brand-badge">
                    <i class="bi bi-fish-fill"></i>
                </div>
                <h5>Segmentasi Pelanggan</h5>
                <p>Sistem Informasi Segmentasi Pelanggan</p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                <i class="bi {% if category == 'danger' %}bi-exclamation-triangle-fill{% elif category == 'success' %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                <div>{{ message }}</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <!-- Login Form -->
            <form action="{{ url_for('auth.login') }}" method="POST">
                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group-custom">
                        <span class="input-icon-left">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control-custom" id="username" name="username"
                            placeholder="Masukkan username" required autocomplete="username">
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group-custom">
                        <span class="input-icon-left">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control-custom pe-5" id="password" name="password"
                            placeholder="Masukkan password" required autocomplete="current-password">
                        <button class="password-toggle-btn" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login">
                    <span>Masuk &rarr;</span>
                </button>
            </form>

            <!-- Role Access Guidelines -->
            <div class="role-hint">
                Akses Masuk: <span>OPERATOR</span> <span>OWNER</span>
            </div>

        </div>
    </div>

    <!-- Script toggle password -->
    <script>
        function togglePassword() {
            var input = document.getElementById('password');
            var icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
